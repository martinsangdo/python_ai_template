name: String Pattern Guard

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Block Forbidden Prefix
        run: |
          # -r: recursive (search all files)
          # -q: quiet (don't print every line, just check if it exists)
          # !: reverse the result (if found, exit with error)
          
          if grep -rq "Z0FBQUFBQ" .; then
            echo "::error::Found forbidden prefix Z0FBQUFBQ! Push blocked."
            exit 1
          else
            echo "No forbidden strings found."
          fi