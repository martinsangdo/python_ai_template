name: String Pattern Guard

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Block Forbidden Prefix
        run: |
          # 1. Search and save results to a variable
          # -r: recursive, -n: show line number, -I: ignore binary files
          RESULTS=$(grep -rnI "Z0FBQUFBQ" . --exclude-dir=.github || true)

          # 2. Check if the variable is NOT empty
          if [ -n "$RESULTS" ]; then
            echo "::error::Forbidden string found in the following locations:"
            echo "$RESULTS"
            exit 1
          else
            echo "✅ Scan complete. No forbidden strings found."
          fi