name: String Pattern Guard

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Block Forbidden Prefix
        run: |
          # --exclude-dir=.github prevents the script from finding itself
          if grep -rq "Z0FBQUFBQ" . --exclude-dir=.github; then
            echo "::error::Found forbidden prefix Z0FBQUFBQ in your code! Push blocked."
            exit 1
          else
            echo "Scan complete. No forbidden strings found in project files."
          fi